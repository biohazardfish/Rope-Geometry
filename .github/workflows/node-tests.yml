name: Rope Geometry checks
on:
  push:
    branches:
      - feature/somerville-egc-knoto-id
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - 'package*.json'
      - '.github/workflows/node-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run audit:somerville
